  <style>
:root {
  --navy: #1b1e4f;
  --navy-2: #2f3a8f;
  --accent: #22d89b;
  --accent-strong: #12b07c;
  --accent-bg: #e3fbf2;
  --hero-1: #2f56e8;
  --hero-2: #5b3fd6;
  --bg: #f5f6fb;
  --card: #ffffff;
  --text: #1d2433;
  --muted: #667085;
  --line: #e3e7ee;
  --ok: #12805c;
  --ok-bg: #e5f6ef;
  --warn: #a15c00;
  --warn-bg: #fff2df;
  --bad: #b42318;
  --bad-bg: #fde9e7;
  --info: #1f5fbf;
  --info-bg: #e8f0fd;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.25; }
h1 { font-size: 20px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
a { color: var(--navy-2); }

.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
  gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand img { display: block; }
.logo-full { height: 30px; width: auto; }
.logo-ikon { height: 32px; width: auto; display: none !important; }
.brand-lms { font-weight: 800; color: var(--navy); font-size: 13px; letter-spacing: .04em; border-left: 1px solid var(--line); padding-left: 10px; }
.topbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.user-chip { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--hero-1); color: var(--hero-1); border-radius: 99px;
  padding: 5px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.user-chip:empty { display: none; }
@media (max-width: 560px) {
  .logo-full, .user-chip { display: none !important; }
  .logo-ikon { display: block !important; }
}

main { max-width: 1200px; margin: 0 auto; padding: 16px; }
.pad { padding: 24px; } .center { text-align: center; } .muted { color: var(--muted); }
.small { font-size: 13px; } .mt { margin-top: 12px; } .mb { margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  box-shadow: 0 1px 2px rgba(27,30,79,.04); }
.card.narrow { max-width: 420px; margin: 24px auto; }

label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #cdd3dd; border-radius: 9px; background: #fff; color: var(--text); }
textarea { min-height: 120px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--navy-2); outline-offset: -1px; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; }
.check input { width: auto; margin-top: 3px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border-radius: 9px;
  border: 1px solid #cdd3dd; background: #fff; color: var(--text); cursor: pointer; font-weight: 600; text-decoration: none; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--navy); }
.btn.white { background: #fff; border-color: #fff; color: var(--hero-1); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.block { width: 100%; }
.btn.big { padding: 14px; font-size: 16px; }

.tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 12px; border-bottom: 1px solid var(--line); }
.tab { padding: 10px 14px; border: 0; background: none; cursor: pointer; font-weight: 600; color: var(--muted);
  border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.active { color: var(--navy); border-bottom-color: var(--accent); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-hadir { background: var(--ok-bg); color: var(--ok); }
.b-izin, .b-sakit { background: var(--info-bg); color: var(--info); }
.b-alpa { background: var(--bad-bg); color: var(--bad); }
.b-belum { background: var(--warn-bg); color: var(--warn); }
.b-none { background: #eef0f4; color: var(--muted); }

.sesi-card { border-left: 5px solid var(--line); }
.sesi-card.buka { border-left-color: var(--accent); }
.sesi-card.done { border-left-color: var(--ok); }
.sesi-time { font-size: 13px; color: var(--muted); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
td.clickable { cursor: pointer; }
td.clickable:hover { background: #f7f9fc; }
code, .kode { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }

.stat { display: flex; gap: 8px; flex-wrap: wrap; }
.stat div { background: #f7f9fc; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; font-size: 13px; }
.stat b { font-size: 16px; }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(10,20,40,.55); display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 640px) { .modal { align-items: center; } }
.modal-box { background: #fff; width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px; }
@media (min-width: 640px) { .modal-box { border-radius: 16px; } }
.hidden { display: none !important; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px);
  background: #1d2433; color: #fff; padding: 10px 16px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast.error { background: var(--bad); } .toast.ok { background: var(--ok); }

.alert { padding: 10px 12px; border-radius: 9px; font-size: 14px; margin: 8px 0; }
.alert.ok { background: var(--ok-bg); color: var(--ok); }
.alert.bad { background: var(--bad-bg); color: var(--bad); }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.info { background: var(--info-bg); color: var(--info); }

.steps { display: flex; gap: 6px; margin-bottom: 12px; }
.steps span { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.steps span.on { background: var(--accent); }

video, .preview-img { width: 100%; border-radius: 10px; background: #000; display: block; }
video.mirror { transform: scaleX(-1); }
.sigpad { width: 100%; height: 200px; border: 2px dashed #b9c1ce; border-radius: 10px; background: #fff; touch-action: none; display: block; }
.thumb { max-width: 100%; border-radius: 8px; border: 1px solid var(--line); }

table.rundown td { border-bottom: 1px solid var(--line); }
.rd-jam { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); width: 1%; }
tr.rd-now td { background: var(--warn-bg); }
.materi-item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.materi-item:last-child { border-bottom: 0; }
.materi-ikon { font-size: 24px; flex: none; }
.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
@media (min-width: 640px) { .gallery { grid-template-columns: repeat(4, 1fr); } }
.gallery-item { padding: 0; border: 0; background: #eef0f4; border-radius: 8px; overflow: hidden; aspect-ratio: 1; cursor: pointer; position: relative; }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-item .tag { position: absolute; left: 4px; top: 4px; }
.gallery-item.noimg::after { content: '🖼'; font-size: 28px; position: absolute; inset: 0; display: grid; place-items: center; }
.rd-head { display: flex; align-items: center; gap: 6px; }
.rd-head input[type=time] { flex: 1; min-width: 0; padding: 8px 6px; }
.rd-item { border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #fbfcfe; }
.rd-no { width: 24px; height: 24px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
.rd-edit td { padding: 4px; }
.rd-edit input { padding: 6px 8px; }
.rd-edit input[type=time] { min-width: 92px; }
.progress { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .2s; }

/* ---------- Login */
body.login-mode .topbar { display: none; }
.login-wrap { display: grid; gap: 16px; max-width: 1060px; margin: 0 auto; }
.login-hero { background: linear-gradient(160deg, #eef0ff, #f7f8ff 60%, #eafcf5); border-radius: 24px; padding: 20px; text-align: center; }
.login-logo { width: 100%; max-width: 300px; height: auto; display: block; margin: 0 auto 14px; }
.login-foto { width: 100%; max-width: 520px; height: auto; display: block; margin: 0 auto; border-radius: 18px; }
.login-card { padding: 24px; margin: 0; }
.login-card h2 { font-size: 20px; font-weight: 800; color: var(--navy); }
.login-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 18px 0 0; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: #eef0f6; border-radius: 12px; padding: 4px; margin: 14px 0 6px; }
.seg button { border: 0; background: none; padding: 10px; border-radius: 9px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.active { background: #fff; color: var(--navy); box-shadow: 0 1px 3px rgba(27,30,79,.12); }
@media (min-width: 900px) {
  .login-wrap { grid-template-columns: 1.15fr 1fr; align-items: center; min-height: calc(100vh - 32px); }
  .login-hero { padding: 32px; text-align: left; }
  .login-logo { margin: 0 0 18px; }
  .login-card { padding: 32px; }
}

/* ---------- Komponen dashboard */
.chip { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.chip-green { background: var(--accent-bg); color: var(--accent-strong); }
.chip-blue { background: #e8edff; color: var(--hero-1); }
.chip-live { background: #ef4b5f; color: #fff; }
.chip-glass { background: rgba(255,255,255,.18); color: #fff; }

/* ---------- Shell peserta: menu samping (desktop) / menu geser (HP) */
.shell { display: block; }
.sidenav { display: flex; gap: 6px; overflow-x: auto; margin: -4px -16px 14px; padding: 4px 16px; scrollbar-width: none; }
.sidenav::-webkit-scrollbar { display: none; }
.navlink { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #fff; color: var(--navy);
  padding: 9px 14px; border-radius: 99px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.navlink.active { background: #e8edff; border-color: #c9d4ff; color: var(--hero-1); }
.nav-ic { font-size: 16px; }
.page-head h1 { font-size: 22px; font-weight: 800; color: var(--navy); margin: 0; }
.page-head p { margin: 2px 0 0; }
.page-head { margin-bottom: 14px; }
.section-title { font-size: 17px; font-weight: 800; color: var(--navy); margin: 18px 0 10px; }
@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
  .sidenav { flex-direction: column; margin: 0; padding: 12px; position: sticky; top: 72px; background: #fff;
    border: 1px solid var(--line); border-radius: var(--radius); }
  .navlink { border: 0; border-radius: 10px; padding: 12px 14px; justify-content: flex-start; }
  .navlink.active { box-shadow: inset -3px 0 0 var(--hero-1); }
}

.hero { background: linear-gradient(120deg, var(--hero-1), var(--hero-2)); color: #fff; border-radius: 24px; padding: 22px;
  display: flex; flex-direction: column; gap: 16px; margin-bottom: 14px; box-shadow: 0 10px 30px rgba(47,86,232,.25); }
.hero-title { font-size: 22px; font-weight: 800; margin: 10px 0 6px; color: #fff; }
.hero-sub { opacity: .92; font-size: 14px; }
.hero-now { margin-top: 10px; background: rgba(255,255,255,.14); border-radius: 10px; padding: 8px 12px; font-size: 14px; display: inline-block; }
.hero .btn.white { width: 100%; }
@media (min-width: 700px) {
  .hero { flex-direction: row; align-items: center; justify-content: space-between; padding: 28px 32px; }
  .hero-title { font-size: 28px; }
  .hero .btn.white { width: auto; white-space: nowrap; }
}
.grid3 { display: grid; grid-template-columns: 1fr; gap: 14px; }
.grid3 .card, .grid2.split .card { margin-bottom: 0; }
.grid2.split { margin-bottom: 14px; align-items: start; }
@media (min-width: 900px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }
.stat-card { padding: 20px; }
.stat-main { font-size: 17px; font-weight: 800; color: var(--navy); margin: 12px 0 4px; line-height: 1.3; }
.mini-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.mini-box { background: #f6f7fb; border-radius: 12px; padding: 10px; text-align: center; }
.mini-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.mini-val { font-size: 22px; font-weight: 800; color: var(--hero-1); }

#print-area { display: none; }
.cards-print { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kartu { border: 1.5px dashed #555; border-radius: 8px; padding: 10px; break-inside: avoid; font-size: 12px; }
.kartu .kode { font-size: 18px; display: block; margin: 4px 0; }
@media print {
  body > *:not(#print-area) { display: none !important; }
  #print-area { display: block !important; }
  body { background: #fff; }
}
</style>

  <script>
// ===================================================== Utilitas bersama
const S = { token: null, user: null, timeOffset: 0 };

function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, val);
  } catch (e) { return null; }
}

function deviceId() {
  let id = store('lms_device');
  if (!id) {
    id = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    store('lms_device', id);
  }
  return id;
}

/**
 * Memanggil API LMS (Google Apps Script) di LMS_CONFIG.API_URL.
 * Content-Type text/plain agar browser tidak mengirim preflight CORS (tidak didukung Apps Script).
 */
async function call(action, data) {
  const url = (window.LMS_CONFIG && LMS_CONFIG.API_URL) || '';
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]{20,}\/exec$/.test(url) || /GANTI/.test(url)) {
    throw new Error('API_URL belum diisi dengan benar. Isi dengan Web app URL Apps Script yang berakhiran /exec (bukan /dev).');
  }
  let r;
  try {
    r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: action, data: Object.assign({ token: S.token }, data || {}) }),
      redirect: 'follow',
    });
  } catch (err) {
    throw new Error(navigator.onLine === false
      ? 'Tidak ada internet. Periksa koneksi Anda lalu coba lagi.'
      : 'Server LMS tidak bisa dihubungi. Pastikan deployment Apps Script sudah "New version" dengan akses "Anyone", lalu coba lagi.');
  }
  const text = await r.text();
  let res;
  try {
    res = JSON.parse(text);
  } catch (err) {
    console.error('Balasan API bukan JSON', r.status, text.slice(0, 500));
    throw new Error('Server LMS membalas tidak sesuai (status ' + r.status + '). Kemungkinan Code.gs versi baru belum di-deploy sebagai "New version".');
  }
  if (res && res.ok) return res.data;
  const msg = res && res.error ? res.error : 'Terjadi kesalahan.';
  if (/Sesi login habis/.test(msg) && S.token) { clearLogin(); showLogin(); }
  throw new Error(msg);
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function render(html) { $('#app').innerHTML = html; window.scrollTo(0, 0); }

let toastTimer;
function toast(msg, type) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), type === 'error' ? 6000 : 3000);
}

function openModal(html) {
  $('#modal-box').innerHTML = html;
  $('#modal').classList.remove('hidden');
}
function closeModal() {
  $('#modal').classList.add('hidden');
  $('#modal-box').innerHTML = '';
  if (window.onModalClose) { const f = window.onModalClose; window.onModalClose = null; f(); }
}
document.addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

/** Menjalankan aksi async sambil menonaktifkan tombol; error ditampilkan sebagai toast. */
async function busy(btn, fn, label) {
  const old = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = label || 'Memproses…'; }
  try { return await fn(); }
  catch (e) { toast(e.message, 'error'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = old; } }
}

// ----------------------------------------------------- Waktu (WIB, mengikuti jam server)
function serverNow() { return new Date(Date.now() + S.timeOffset); }
function syncTime(serverMs) { if (serverMs) S.timeOffset = serverMs - Date.now(); }

const BULAN = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
const HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

/** 'yyyy-mm-dd' -> 'Kamis, 30 Okt 2026' */
function fmtTanggal(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d));
  return HARI[dt.getUTCDay()] + ', ' + d + ' ' + BULAN[m - 1] + ' ' + y;
}

/** Date -> bagian-bagian waktu WIB */
function wib(date) {
  const p = {};
  new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false,
  }).formatToParts(date).forEach(x => { p[x.type] = x.value; });
  const tanggal = p.year + '-' + p.month + '-' + p.day;
  return { tanggal: tanggal, jam: p.hour + ':' + p.minute + ':' + p.second, teks: fmtTanggal(tanggal) + ' ' + p.hour + ':' + p.minute + ':' + p.second + ' WIB' };
}

function jamSaja(stamp) { return stamp ? stamp.slice(11, 16) : ''; }

const STATUS_LABEL = { hadir: 'Hadir', izin: 'Izin', sakit: 'Sakit', alpa: 'Alpa', belum: 'Belum absen', '': '—' };
function badge(status) {
  return '<span class="badge b-' + (status || 'none') + '">' + esc(STATUS_LABEL[status] || status) + '</span>';
}

/** Pengganti thumbnail yang gagal dimuat (mis. file Drive baru belum siap atau koneksi lambat). */
function fotoGagal(img) {
  img.style.display = 'none';
  img.parentNode.classList.add('noimg');
}

/** Memperkecil gambar (sisi terpanjang maks `max` px) dan mengubahnya menjadi JPEG data URL. */
function kompresGambar(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => reject(new Error('Bukan file gambar yang valid.'));
    img.src = URL.createObjectURL(file);
  });
}

// ----------------------------------------------------- GPS
function getPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('Perangkat tidak mendukung GPS.'));
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, akurasi: p.coords.accuracy }),
      err => reject(new Error(err.code === 1
        ? 'Izin lokasi ditolak. Izinkan akses lokasi untuk situs ini di pengaturan browser, lalu coba lagi.'
        : 'Lokasi tidak terbaca. Pastikan GPS aktif, lalu coba lagi.')),
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
}

function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = x => x * Math.PI / 180;
  const a = Math.sin(rad(lat2 - lat1) / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(rad(lng2 - lng1) / 2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(a)));
}

// ----------------------------------------------------- Login
function saveLogin(res) {
  S.token = res.token; S.user = res.user;
  store('lms_token', res.token);
}
function clearLogin() {
  if (S.user) store('lms_cache_' + S.user.id_user, null);
  S.token = null; S.user = null; store('lms_token', null);
}

/** Data terakhir yang tersimpan di perangkat, agar halaman langsung tampil sambil menunggu server. */
function cacheGet(key) {
  try { return JSON.parse(store('lms_cache_' + S.user.id_user) || '{}')[key] || null; } catch (e) { return null; }
}
function cacheSet(key, val) {
  try {
    const all = JSON.parse(store('lms_cache_' + S.user.id_user) || '{}');
    all[key] = val;
    store('lms_cache_' + S.user.id_user, JSON.stringify(all));
  } catch (e) { /* penyimpanan penuh / tidak tersedia: abaikan */ }
}

async function logoutNow() {
  try { await call('logout'); } catch (e) { /* tetap keluar */ }
  clearLogin();
  showLogin();
}

function setTopbar(sub, actionsHtml) {
  $('#topbar-sub').textContent = sub ? '👤 ' + sub : '';
  $('#topbar-actions').innerHTML = actionsHtml || '';
  document.body.classList.remove('login-mode');
}

async function boot() {
  S.token = store('lms_token');
  if (!S.token) return showLogin();
  try {
    const r = await call('me');
    S.user = r.user;
    route(r);
  } catch (e) {
    clearLogin();
    showLogin();
  }
}

function route(meRes) {
  if (S.user.role === 'peserta') showPeserta(meRes); else showPic(meRes);
}

async function showLogin(tab) {
  tab = tab || store('lms_login_tab') || 'peserta';
  setTopbar('', '');
  document.body.classList.add('login-mode');
  render(`
    <div class="login-wrap">
      <section class="login-hero">
        <img class="login-logo" src="${ASET.logo}" alt="Artha Safety Indonesia">
        <img class="login-foto" src="${ASET.foto}" alt="Safety Champions Artha Safety Indonesia">
      </section>
      <section class="card login-card">
        <h2>Masuk ke akun Anda</h2>
        <p class="muted small">Pilih jenis akun, lalu masukkan kode Anda.</p>
        <div class="seg">
          <button class="${tab === 'peserta' ? 'active' : ''}" onclick="showLogin('peserta')">👷 Peserta</button>
          <button class="${tab === 'pic' ? 'active' : ''}" onclick="showLogin('pic')">🛡️ PIC / Admin</button>
        </div>
        <div id="login-form"><div class="muted small">Memuat…</div></div>
        <p class="login-foot">© ${serverNow().getFullYear()} Artha Safety Indonesia</p>
      </section>
    </div>`);
  store('lms_login_tab', tab);
  if (tab === 'pic') {
    $('#login-form').innerHTML = `
      <form onsubmit="event.preventDefault(); doLoginPic(this)">
        <label>Kode PIC</label><input name="kode" autocomplete="username" required>
        <label>PIN</label><input name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
        <button class="btn primary block big mt">Masuk</button>
      </form>`;
    return;
  }
  try {
    const batches = await call('batchAktif');
    if (!batches.length) {
      $('#login-form').innerHTML = '<div class="alert warn">Belum ada batch pelatihan yang aktif.</div>';
      return;
    }
    const last = store('lms_batch');
    $('#login-form').innerHTML = `
      <form onsubmit="event.preventDefault(); doLoginPeserta(this)">
        <label>Batch pelatihan</label>
        <select name="id_batch" ${batches.length === 1 ? 'disabled' : ''}>
          ${batches.map(b => `<option value="${esc(b.id_batch)}" ${b.id_batch === last ? 'selected' : ''}>${esc(b.kode_batch)} — ${esc(b.nama_pelatihan)}</option>`).join('')}
        </select>
        <label>Kode peserta</label>
        <input name="kode" placeholder="contoh: 001-Kikis" autocapitalize="off" autocomplete="off" required>
        <p class="small muted">Kode ada di kartu peserta dari PIC (nomor absen + nama depan).</p>
        <button class="btn primary block big">Masuk</button>
      </form>`;
  } catch (e) {
    $('#login-form').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>';
  }
}

function doLoginPeserta(form) {
  const id_batch = form.id_batch.value;
  busy(form.querySelector('button'), async () => {
    const res = await call('loginPeserta', { id_batch: id_batch, kode: form.kode.value, device_id: deviceId() });
    store('lms_batch', id_batch);
    saveLogin(res);
    route(res.me);
  });
}

function doLoginPic(form) {
  busy(form.querySelector('button'), async () => {
    const res = await call('loginPic', { kode: form.kode.value, pin: form.pin.value });
    saveLogin(res);
    route(res.me);
  });
}
</script>
  <script>
// ===================================================== Halaman peserta
const P = { batch: null, status: null, konten: null, tab: 'beranda' };

function showPeserta(meRes) {
  P.batch = meRes.batch;
  if (meRes.beranda) {
    cacheSet('beranda', meRes.beranda);
    P.segar = meRes.beranda; // data baru dari server, tidak perlu dimuat ulang
  }
  setTopbar(S.user.nama + ' · ' + S.user.kode_login, '<button class="btn sm" onclick="logoutNow()">Keluar</button>');
  if (!S.user.setuju_privasi) return showPersetujuan();
  pesertaTab(P.tab);
}

function showPersetujuan() {
  render(`
    <div class="card narrow">
      <h1>Selamat datang, ${esc(S.user.nama)}</h1>
      <p class="muted">${esc(P.batch.kode_batch)} — ${esc(P.batch.nama_pelatihan)}</p>
      <div class="alert info small">
        Untuk absensi, LMS ini akan merekam <b>foto wajah</b>, <b>tanda tangan</b>, dan <b>lokasi GPS</b> Anda
        setiap sesi. Data hanya digunakan untuk keperluan administrasi dan laporan pelatihan
        Artha Safety Indonesia, dan hanya dapat dilihat oleh PIC pelatihan.
      </div>
      <label class="check"><input type="checkbox" id="setuju-cb"> Saya mengerti dan menyetujui penggunaan data tersebut.</label>
      <button class="btn primary block big mt" onclick="doSetuju(this)">Lanjutkan</button>
    </div>`);
}

function doSetuju(btn) {
  if (!$('#setuju-cb').checked) return toast('Centang persetujuan terlebih dahulu.', 'error');
  busy(btn, async () => {
    S.user = await call('setuju');
    pesertaTab('beranda');
  });
}

const NAV_PESERTA = [
  ['beranda', '🏠', 'Dashboard'], ['rundown', '🗓️', 'Jadwal & Rundown'], ['materi', '📚', 'Materi'],
  ['dok', '📷', 'Dokumentasi'], ['riwayat', '✅', 'Riwayat Absen'],
];

function pesertaTab(tab) {
  P.tab = tab;
  const aktif = NAV_PESERTA.find(n => n[0] === tab);
  render(`
    <div class="shell">
      <nav class="sidenav">
        ${NAV_PESERTA.map(n => `<button class="navlink ${tab === n[0] ? 'active' : ''}" onclick="pesertaTab('${n[0]}')">
          <span class="nav-ic">${n[1]}</span><span>${n[2]}</span></button>`).join('')}
      </nav>
      <section class="shell-main">
        <div class="page-head">
          <h1>${tab === 'beranda' ? 'Selamat Datang di Dashboard Peserta' : aktif[2]}</h1>
          ${tab === 'beranda' ? `<p class="muted">Halo, ${esc(S.user.nama)} 👋</p>` : ''}
        </div>
        <div id="tab-body"><div class="center muted pad">Memuat…</div></div>
      </section>
    </div>`);
  if (tab === 'beranda') loadBeranda();
  else if (tab === 'riwayat') loadRiwayat();
  else loadKonten(tab);
}

function tampilBeranda(b) {
  P.status = b.status;
  P.konten = b.konten;
  $('#tab-body').innerHTML = berandaHtml(b.status, b.konten) + kontenHariIniHtml(b.konten);
}

/** Tampilkan data tersimpan dulu (instan), lalu ganti dengan data terbaru dari server. */
async function loadBeranda() {
  if (P.segar) {
    const b = P.segar;
    P.segar = null;
    syncTime(b.status.server_now);
    return tampilBeranda(b);
  }
  const lama = cacheGet('beranda');
  if (lama) tampilBeranda(lama);
  try {
    const b = await call('beranda');
    syncTime(b.status.server_now);
    cacheSet('beranda', b);
    if (P.tab !== 'beranda' || !$('#modal').classList.contains('hidden')) return;
    tampilBeranda(b);
  } catch (e) {
    if (!lama) $('#tab-body').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>';
    else toast(e.message, 'error');
  }
}

function berandaHtml(st, k) {
  return heroHtml(st, k) + statHtml(st) + (st.hari ? `
    <h2 class="section-title">Absensi Hari Ini</h2>
    <div class="grid2">${st.hari.sesi.map(sesiCardHtml).join('')}</div>` : '');
}

/** Kartu utama bergradasi: hari ini, sesi yang sedang dibuka, dan kegiatan yang sedang berjalan. */
function heroHtml(st, k) {
  const b = st.batch;
  let chip, judul, sub, aksi = '', now = '';
  if (st.hari) {
    const h = st.hari;
    const buka = h.sesi.find(s => s.state === 'buka' && s.status !== 'hadir');
    chip = buka ? `<span class="chip chip-live">● Absen Sesi ${buka.sesi} dibuka</span>`
      : `<span class="chip chip-glass">Hari ke-${esc(h.hari_ke)} dari ${esc(h.total_hari)}</span>`;
    judul = `${esc(b.nama_pelatihan)} – Hari Ke-${esc(h.hari_ke)}`;
    sub = `${esc(fmtTanggal(st.tanggal))} · ${esc(h.sesi[0].mulai)}–${esc(h.sesi[h.sesi.length - 1].selesai)} WIB · 📍 ${esc(h.lokasi.nama)}`;
    if (buka) aksi = `<button class="btn white big" onclick="mulaiAbsen(${buka.sesi})">📸 Absen Sesi ${buka.sesi} Sekarang</button>`;
    const hk = k.hari.find(x => x.tanggal === k.tanggal);
    const jalan = hk && hk.rundown.find(r => k.jam >= r.jam_mulai && k.jam < r.jam_selesai);
    if (jalan) now = `<div class="hero-now">▶ Sedang berlangsung: <b>${esc(jalan.kegiatan)}</b> (${esc(jalan.jam_mulai)}–${esc(jalan.jam_selesai)})</div>`;
  } else {
    chip = '<span class="chip chip-glass">Tidak ada jadwal hari ini</span>';
    judul = esc(b.nama_pelatihan);
    sub = st.berikutnya ? 'Jadwal pelatihan berikutnya: <b>' + esc(fmtTanggal(st.berikutnya)) + '</b>'
      : st.hari_selesai ? 'Pelatihan telah selesai. Terima kasih atas partisipasi Anda!' : '';
  }
  return `
    <div class="hero">
      <div class="hero-text">${chip}<h2 class="hero-title">${judul}</h2><div class="hero-sub">${sub}</div>${now}</div>
      ${aksi ? `<div class="hero-aksi">${aksi}</div>` : ''}
    </div>`;
}

function statHtml(st) {
  const b = st.batch, r = st.rekap;
  const pct = r.total ? Math.round(r.hadir / r.total * 100) + '%' : '–';
  const hariKe = st.hari ? Number(st.hari.hari_ke) : st.hari_selesai;
  const progres = st.total_hari ? Math.round(hariKe / st.total_hari * 100) : 0;
  const status = st.hari ? 'Sedang berlangsung' : st.berikutnya && !st.hari_selesai ? 'Belum dimulai' : st.berikutnya ? 'Jeda' : 'Selesai';
  const tgl = b.tgl_mulai === b.tgl_selesai ? fmtTanggal(b.tgl_mulai) : fmtTanggal(b.tgl_mulai).replace(/^\w+, /, '') + ' – ' + fmtTanggal(b.tgl_selesai).replace(/^\w+, /, '');
  return `
    <div class="grid3">
      <div class="card stat-card">
        <span class="chip chip-blue">Program Anda</span>
        <div class="stat-main">${esc(b.nama_pelatihan)}</div>
        <div class="small muted">Batch ${esc(b.kode_batch)} • ${esc(tgl)}</div>
      </div>
      <div class="card stat-card">
        <span class="chip chip-blue">Kehadiran Saya</span>
        <div class="mini-row">
          <div class="mini-box"><div class="mini-label">Sesi hadir</div><div class="mini-val">${r.hadir} / ${r.total}</div></div>
          <div class="mini-box"><div class="mini-label">Persentase</div><div class="mini-val">${pct}</div></div>
        </div>
      </div>
      <div class="card stat-card">
        <span class="chip chip-green">Progres Pelatihan</span>
        <div class="row" style="justify-content:space-between;margin-top:10px">
          <div><div class="mini-label">Hari ke</div><div class="stat-main" style="margin:0">${hariKe} / ${st.total_hari}</div></div>
          <div style="text-align:right"><div class="mini-label">Status</div><b>${status}</b></div>
        </div>
        <div class="progress mt"><span style="width:${progres}%"></span></div>
      </div>
    </div>`;
}

function sesiCardHtml(s) {
  const done = s.status === 'hadir';
  let body;
  if (done) {
    body = `<div class="alert ok">✅ Sudah absen pukul <b>${esc(jamSaja(s.absen.waktu))} WIB</b></div>`;
  } else if (s.state === 'buka') {
    body = (s.status !== 'belum' ? `<div class="mb">${badge(s.status)} <span class="small muted">${esc(s.absen && s.absen.keterangan || '')}</span></div>` : '') +
      `<button class="btn accent block big" onclick="mulaiAbsen(${s.sesi})">📸 Absen Sesi ${s.sesi} sekarang</button>`;
  } else if (s.state === 'belum_dibuka') {
    body = `<div class="muted small">Tombol absen aktif pukul ${esc(s.mulai)} WIB.</div>`;
  } else {
    body = `<div>${badge(s.status)} ${s.absen && s.absen.keterangan ? '<span class="small muted">' + esc(s.absen.keterangan) + '</span>' : ''}</div>`;
  }
  return `
    <div class="card sesi-card ${done ? 'done' : s.state === 'buka' ? 'buka' : ''}">
      <div class="row"><h2 class="grow">Sesi ${s.sesi} — ${s.sesi === 1 ? 'Pagi' : 'Siang'}</h2>
        <span class="sesi-time">${esc(s.mulai)}–${esc(s.selesai)} WIB</span></div>
      ${body}
    </div>`;
}

// ----------------------------------------------------- Rundown, materi, dokumentasi
function kontenHariIniHtml(k) {
  const h = k.hari.find(x => x.tanggal === k.tanggal);
  let html = '';
  if (h) {
    html += `<div class="grid2 split">
      <div class="card"><h2>🗓️ Rundown Hari Ini</h2>${rundownHtml(h.rundown, k.jam)}</div>
      <div class="card"><h2>📚 Materi Hari Ini</h2>${materiHtml(h.materi)}</div>
    </div>`;
    if (h.dok.length) html += `<div class="card"><h2>📷 Dokumentasi Hari Ini</h2>${galeriHtml(h, 6)}</div>`;
  }
  return html + `<button class="btn block" onclick="loadBeranda()">↻ Muat ulang</button>`;
}

async function loadKonten(tab) {
  const lama = P.konten || (cacheGet('beranda') || {}).konten;
  if (lama) $('#tab-body').innerHTML = kontenTabHtml(tab, lama);
  try {
    const k = await call('kontenPeserta');
    if (P.tab !== tab) return;
    P.konten = k;
    $('#tab-body').innerHTML = kontenTabHtml(tab, k);
  } catch (e) {
    if (!lama) $('#tab-body').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>';
    else toast(e.message, 'error');
  }
}

function kontenTabHtml(tab, k) {
  const hari = tab === 'rundown' ? k.hari : k.hari.filter(h => h.tanggal <= k.tanggal).reverse();
  const kosong = { rundown: 'Rundown belum diterbitkan PIC.', materi: 'Belum ada materi.', dok: 'Belum ada dokumentasi.' }[tab];
  const isi = hari.map(h => {
    const items = tab === 'rundown' ? h.rundown : tab === 'materi' ? h.materi : h.dok;
    if (!items.length) return '';
    const body = tab === 'rundown' ? rundownHtml(items, h.tanggal === k.tanggal ? k.jam : null)
      : tab === 'materi' ? materiHtml(items) : galeriHtml(h);
    return `<div class="card">
      <div class="row mb"><h2 class="grow">Hari ke-${esc(h.hari_ke)}</h2>
        <span class="small muted">${esc(fmtTanggal(h.tanggal))}${h.tanggal === k.tanggal ? ' · <b>hari ini</b>' : ''}</span></div>
      ${body}</div>`;
  }).join('');
  return isi || `<div class="card center muted">${kosong}</div>`;
}

/** jamSekarang diisi hanya untuk hari ini, untuk menandai kegiatan yang sedang berlangsung. */
function rundownHtml(items, jamSekarang) {
  if (!items.length) return '<div class="muted small">Rundown belum diterbitkan PIC.</div>';
  return `<div class="table-wrap"><table class="rundown">
    <tbody>${items.map(r => {
      const now = jamSekarang && jamSekarang >= r.jam_mulai && jamSekarang < r.jam_selesai;
      return `<tr class="${now ? 'rd-now' : ''}">
        <td class="rd-jam">${esc(r.jam_mulai)}–${esc(r.jam_selesai)}</td>
        <td><b>${esc(r.kegiatan)}</b> ${now ? '<span class="badge b-belum">Sedang berlangsung</span>' : ''}
          ${r.pemateri ? `<div class="small">👤 ${esc(r.pemateri)}</div>` : ''}
          ${r.keterangan ? `<div class="small muted">${esc(r.keterangan)}</div>` : ''}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`;
}

const IKON_FILE = { pdf: '📕', ppt: '📙', pptx: '📙', doc: '📘', docx: '📘', xls: '📗', xlsx: '📗', jpg: '🖼', jpeg: '🖼', png: '🖼', link: '🔗' };

function materiHtml(items) {
  if (!items.length) return '<div class="muted small">Belum ada materi.</div>';
  return items.map(m => `
    <div class="materi-item">
      <div class="materi-ikon">${IKON_FILE[m.tipe_file] || '📄'}</div>
      <div class="grow">
        <b>${esc(m.judul)}</b>
        <div class="small muted">${m.kategori === 'latihan' ? 'Lembar latihan' : 'Materi'} · ${esc(m.tipe_file.toUpperCase())}</div>
      </div>
      <div class="row">
        <a class="btn sm" href="${esc(m.buka)}" target="_blank" rel="noopener">Buka</a>
        ${m.unduh ? `<a class="btn sm" href="${esc(m.unduh)}" target="_blank" rel="noopener">⬇</a>` : ''}
      </div>
    </div>`).join('');
}

function galeriHtml(h, max) {
  const items = max ? h.dok.slice(-max) : h.dok;
  return `<div class="gallery">${items.map(d => `
    <button class="gallery-item" onclick="lihatFoto('${esc(h.id_hari)}', '${esc(d.id_dok)}')">
      <img src="${esc(d.thumb)}" alt="${esc(d.keterangan || 'Dokumentasi')}" loading="lazy" referrerpolicy="no-referrer" onerror="fotoGagal(this)">
    </button>`).join('')}</div>
    ${max && h.dok.length > max ? `<button class="btn sm mt" onclick="pesertaTab('dok')">Lihat semua (${h.dok.length})</button>` : ''}`;
}

function lihatFoto(idHari, idDok) {
  const h = P.konten.hari.find(x => x.id_hari === idHari);
  const d = h.dok.find(x => x.id_dok === idDok);
  const keg = d.id_rundown && h.rundown.find(r => r.id_rundown === d.id_rundown);
  openModal(`
    <img class="thumb" src="${esc(d.thumb.replace('sz=w600', 'sz=w1600'))}" alt="" referrerpolicy="no-referrer">
    ${keg ? `<div class="small muted mt">${esc(keg.jam_mulai)} · ${esc(keg.kegiatan)}</div>` : ''}
    ${d.keterangan ? `<p>${esc(d.keterangan)}</p>` : ''}
    <div class="row mt"><a class="btn" href="${esc(d.buka)}" target="_blank" rel="noopener">Buka ukuran penuh</a>
      <button class="btn primary grow" onclick="closeModal()">Tutup</button></div>`);
}

async function loadRiwayat() {
  try {
    const rows = await call('riwayat');
    if (P.tab !== 'riwayat') return;
    $('#tab-body').innerHTML = `
      <div class="card table-wrap">
        <table>
          <thead><tr><th>Hari</th><th>Sesi 1</th><th>Sesi 2</th></tr></thead>
          <tbody>${rows.map(r => `
            <tr>
              <td><b>Hari ke-${esc(r.hari_ke)}</b><div class="small muted">${esc(fmtTanggal(r.tanggal))}</div></td>
              ${r.sesi.map(s => `<td>${badge(s.status)}<div class="small muted">${esc(jamSaja(s.waktu))}</div></td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  } catch (e) {
    $('#tab-body').innerHTML = '<div class="alert bad">' + esc(e.message) + '</div>';
  }
}

// ----------------------------------------------------- Alur absen: lokasi → foto → tanda tangan → kirim
const A = { sesi: 0, pos: null, jarak: null, foto: null, ttd: null, stream: null, pad: null };

function stepsHtml(n) {
  return '<div class="steps">' + [1, 2, 3].map(i => `<span class="${i <= n ? 'on' : ''}"></span>`).join('') + '</div>';
}

function mulaiAbsen(sesi) {
  Object.assign(A, { sesi: sesi, pos: null, jarak: null, foto: null, ttd: null });
  window.onModalClose = stopCamera;
  stepLokasi();
}

async function stepLokasi() {
  const lok = P.status.hari.lokasi;
  openModal(`${stepsHtml(1)}
    <h2>1. Cek lokasi</h2>
    <p class="muted small">Lokasi pelatihan: <b>${esc(lok.nama)}</b> (radius ${esc(lok.radius)} m)</p>
    <div id="lok-status" class="alert info">📡 Membaca lokasi GPS…</div>
    <div class="row mt">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn" id="lok-retry" onclick="stepLokasi()">↻ Coba lagi</button>
      <button class="btn primary grow" id="lok-next" disabled onclick="stepFoto()">Lanjut</button>
    </div>`);
  if (lok.lat === null) {
    $('#lok-status').className = 'alert bad';
    $('#lok-status').textContent = 'Lokasi pelatihan hari ini belum diatur PIC. Hubungi PIC.';
    return;
  }
  try {
    const pos = await getPosition();
    A.pos = pos;
    A.jarak = distanceM(pos.lat, pos.lng, lok.lat, lok.lng);
    const ok = A.jarak <= lok.radius;
    $('#lok-status').className = 'alert ' + (ok ? 'ok' : 'bad');
    $('#lok-status').innerHTML = ok
      ? `✅ Anda berada di lokasi (± ${A.jarak} m dari titik pelatihan, akurasi GPS ± ${Math.round(pos.akurasi)} m).`
      : `❌ Anda berada ± ${A.jarak} m dari lokasi pelatihan. Absen hanya bisa dalam radius ${lok.radius} m.
         ${pos.akurasi > 100 ? '<br><span class="small">Akurasi GPS rendah (± ' + Math.round(pos.akurasi) + ' m). Coba pindah ke area terbuka lalu coba lagi.</span>' : ''}`;
    $('#lok-next').disabled = !ok;
  } catch (e) {
    $('#lok-status').className = 'alert bad';
    $('#lok-status').textContent = e.message;
  }
}

async function stepFoto() {
  openModal(`${stepsHtml(2)}
    <h2>2. Foto selfie</h2>
    <p class="muted small">Pastikan wajah terlihat jelas.</p>
    <div id="cam-area"><div class="alert info">📷 Membuka kamera…</div></div>
    <input type="file" id="cam-file" accept="image/*" capture="user" class="hidden" onchange="fotoDariFile(this)">
    <div class="row mt" id="cam-actions">
      <button class="btn" onclick="closeModal()">Batal</button>
    </div>`);
  try {
    A.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
    $('#cam-area').innerHTML = '<video id="cam-video" class="mirror" autoplay playsinline muted></video>';
    $('#cam-video').srcObject = A.stream;
    $('#cam-actions').innerHTML = `
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn accent grow" onclick="ambilFoto()">📸 Ambil foto</button>`;
  } catch (e) {
    // Kamera langsung tidak tersedia di browser ini → buka kamera bawaan HP.

function stopCamera() {

}

function ambilFoto() {
  const v = $('#cam-video');

  prosesFoto(v, v.videoWidth, v.videoHeight, true);
  stopCamera();
}

function fotoDariFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (Date.now() - file.lastModified > 5 * 60 * 1000) {
    return toast('Gunakan foto yang baru diambil dari kamera.', 'error');
  }
  const img = new Image();
  img.onload = () => { prosesFoto(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(file);
}

/** Perkecil foto (maks 720 px), beri watermark nama + sesi + waktu server + lokasi, simpan sebagai JPEG. */
function prosesFoto(src, w, h, mirror) {
  const MAX = 480; // cukup untuk wajah + watermark terbaca, file ±25–40 KB
  const scale = Math.min(1, MAX / Math.max(w, h));
  const cw = Math.round(w * scale), ch = Math.round(h * scale);
  const c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  const ctx = c.getContext('2d');
  if (mirror) { ctx.translate(cw, 0); ctx.scale(-1, 1); }
  ctx.drawImage(src, 0, 0, cw, ch);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const lok = P.status.hari.lokasi;
  const lines = [
    S.user.nama + ' (' + S.user.kode_login + ') | Sesi ' + A.sesi,
    wib(serverNow()).teks,
    lok.nama + ' | ' + A.pos.lat.toFixed(5) + ', ' + A.pos.lng.toFixed(5) + ' (' + A.jarak + ' m)',
  ];
  const fs = Math.max(12, Math.round(cw / 34));
  const pad = Math.round(fs * 0.6);
  const boxH = lines.length * (fs + 4) + pad * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, ch - boxH, cw, boxH);
  ctx.fillStyle = '#fff';
  ctx.font = '600 ' + fs + 'px system-ui, sans-serif';
  ctx.textBaseline = 'top';
  lines.forEach((t, i) => ctx.fillText(t, pad, ch - boxH + pad + i * (fs + 4), cw - pad * 2));

  A.foto = c.toDataURL('image/jpeg', 0.62);
  $('#cam-area').innerHTML = '<img class="preview-img" src="' + A.foto + '" alt="Foto absen">';
  $('#cam-actions').innerHTML = `
    <button class="btn" onclick="stepFoto()">↻ Ulangi</button>
    <button class="btn primary grow" onclick="stepTtd()">Lanjut</button>`;
}

function stepTtd() {
  openModal(`${stepsHtml(3)}
    <h2>3. Tanda tangan</h2>
    <p class="muted small">Tanda tangani di kotak berikut menggunakan jari.</p>
    <canvas id="sigpad" class="sigpad"></canvas>
    <div class="row mt">
      <button class="btn" onclick="A.pad.clear()">Hapus</button>
      <button class="btn" onclick="stepFoto()">← Foto</button>
      <button class="btn accent grow" id="kirim-btn" onclick="kirimAbsen(this)">Kirim absen</button>
    </div>`);
  A.pad = signaturePad($('#sigpad'));
}

async function kirimAbsen(btn) {
  if (A.pad.isEmpty()) return toast('Tanda tangan masih kosong.', 'error');
  A.ttd = A.pad.toDataURL();
  await busy(btn, async () => {
    const res = await call('absen', { sesi: A.sesi, lat: A.pos.lat, lng: A.pos.lng, akurasi: A.pos.akurasi, foto: A.foto, ttd: A.ttd });
    openModal(`
      <div class="center pad">
        <div style="font-size:48px">✅</div>
        <h2>Absen Sesi ${A.sesi} berhasil</h2>
        <p class="muted">Tercatat pukul <b>${esc(jamSaja(res.waktu))} WIB</b></p>
        <button class="btn primary block" onclick="cacheSet('beranda', null); closeModal(); loadBeranda()">Selesai</button>
      </div>`);
  }, 'Mengirim…');
}

/** Kanvas tanda tangan sederhana (mouse / sentuhan). */
function signaturePad(canvas) {
  const ratio = Math.max(window.devicePixelRatio || 1, 1);
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  let drawing = false, strokes = 0, last = null;
  const clear = () => {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    strokes = 0;
  };
  clear();
  ctx.strokeStyle = '#0b1f3a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const pt = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  canvas.addEventListener('pointerdown', e => { drawing = true; last = pt(e); canvas.setPointerCapture(e.pointerId); strokes++; });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pt(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));
  // Diperkecil (lebar maks 400 px) agar file kecil dan ringan dimuat di laporan PDF.
  const toDataURL = () => {
    const scale = Math.min(1, 400 / canvas.width);
    const out = document.createElement('canvas');
    out.width = Math.round(canvas.width * scale);
    out.height = Math.round(canvas.height * scale);
    out.getContext('2d').drawImage(canvas, 0, 0, out.width, out.height);
    return out.toDataURL('image/png');
  };
  return { clear: clear, isEmpty: () => strokes === 0, toDataURL: toDataURL };
}

/** Form lokasi: nama, koordinat (dari GPS PIC / link Maps / ketik), radius. */
function lokasiForm(p, nama, lat, lng, radius) {
  return `
    <label>Nama lokasi</label><input id="${p}-nama" value="${esc(nama || '')}" placeholder="mis. Kantor ASI Jakarta / Site PT XYZ">
    <div class="row mt">
      <button type="button" class="btn grow" onclick="pakaiLokasiSaya(this, '${p}')">📍 Pakai lokasi saya sekarang</button>
    </div>
    <label>…atau tempel link Google Maps / koordinat</label>
    <div class="row"><input id="${p}-teks" class="grow" placeholder="https://maps.app.goo.gl/… atau -6.2088, 106.8456">
      <button type="button" class="btn" onclick="ambilDariTeks(this, '${p}')">Ambil</button></div>
    <div class="grid2">
      <div><label>Latitude</label><input id="${p}-lat" value="${esc(lat)}" inputmode="decimal"></div>
      <div><label>Longitude</label><input id="${p}-lng" value="${esc(lng)}" inputmode="decimal"></div>
    </div>
    <label>Radius absen (meter)</label><input id="${p}-radius" type="number" min="20" max="5000" value="${esc(radius || 150)}">
    <div id="${p}-cek" class="small mt"></div>`;
}

function lokasiValue(p) {
  return { lokasi_nama: $('#' + p + '-nama').value.trim(), lat: $('#' + p + '-lat').value.trim(), lng: $('#' + p + '-lng').value.trim(), radius_meter: $('#' + p + '-radius').value };
}

function isiKoordinat(p, lat, lng, info) {
  $('#' + p + '-lat').value = Number(lat).toFixed(6);
  $('#' + p + '-lng').value = Number(lng).toFixed(6);
  $('#' + p + '-cek').innerHTML = '<span class="badge b-hadir">✓</span> ' + esc(info) +
    ` · <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">cek di peta</a>`;
}

function pakaiLokasiSaya(btn, p) {
  busy(btn, async () => {
    const pos = await getPosition();
    isiKoordinat(p, pos.lat, pos.lng, 'Lokasi Anda (akurasi ± ' + Math.round(pos.akurasi) + ' m)');
  }, 'Membaca GPS…');
}

function ambilDariTeks(btn, p) {
  busy(btn, async () => {
    const r = await call('lokasiDariTeks', { teks: $('#' + p + '-teks').value });
    isiKoordinat(p, r.lat, r.lng, 'Koordinat ditemukan');
  });
}

async function perbaruiBatch(btn, perubahan, pesan) {
  await busy(btn, async () => {
    const b = await call('batchUbah', { id_batch: C.batch.id_batch, batch: perubahan });
    const i = C.batches.findIndex(x => x.id_batch === b.id_batch);
    C.batches[i] = b; C.batch = b;
    toast(pesan, 'ok');
    tabLokasi();
  });
}

function simpanJam(btn) {
  perbaruiBatch(btn, { sesi1_mulai: $('#s1m').value, sesi1_selesai: $('#s1s').value, sesi2_mulai: $('#s2m').value, sesi2_selesai: $('#s2s').value }, 'Jam sesi disimpan.');
}

function simpanLokasiDefault(btn) {
  const v = lokasiValue('def');
  if (!v.lat || !v.lng) return toast('Isi koordinat lokasi terlebih dahulu.', 'error');
  perbaruiBatch(btn, v, 'Lokasi default disimpan.');
}

function dialogLokasiHari(i) {
  const h = C.hari[i], l = h.lokasi;
  openModal(`
    <h2>Lokasi Hari ke-${esc(h.hari_ke)}</h2>
    <div class="small muted">${esc(fmtTanggal(h.tanggal))}</div>

function simpanLokasiHari(btn, idHari) {

function resetLokasiHari(btn, idHari) {

async function tabRundown() {
  const v = C.view;
  try {
    await muatHari();
    if (!C.idHari) return setBody(v, '<div class="card muted center">Belum ada hari pelatihan.</div>');
    const rd = await call('rundownGet', { id_hari: C.idHari });
    if (v !== C.view) return;
    C.rd = rd.items.length ? rd.items : [{}];
    const STATUS = { terbit: '<span class="badge b-hadir">Terbit — tampil di akun peserta</span>',
      draft: '<span class="badge b-belum">Draft — belum tampil ke peserta</span>', kosong: '<span class="badge b-none">Belum ada rundown</span>' };
    const lain = C.hari.filter(h => h.id_hari !== C.idHari);
    setBody(v, `
      <div class="card">
        <div class="row">${hariSelect('tabRundown')}</div>
        <div class="mt">${STATUS[rd.status]}</div>
      </div>
      <div class="card">
        <h2>Susun rundown</h2>
        <p class="small muted">Urutan otomatis mengikuti jam mulai saat disimpan.</p>
        <div id="rd-rows"></div>
        <button class="btn mt" onclick="rdTambah()">＋ Tambah kegiatan</button>
        <div class="row mt">
          <button class="btn grow" onclick="rdSimpan(this, 'draft')">Simpan sebagai draft</button>
          <button class="btn accent grow" onclick="rdSimpan(this, 'terbit')">Simpan & terbitkan</button>
        </div>
      </div>
      ${lain.length ? `
      <div class="card">
        <h3>Salin dari hari lain</h3>
        <div class="row">
          <select id="rd-asal" class="grow">${lain.map(h => `<option value="${esc(h.id_hari)}">Hari ke-${esc(h.hari_ke)} — ${esc(fmtTanggal(h.tanggal))}</option>`).join('')}</select>
          <button class="btn" onclick="rdSalin(this)">Salin</button>
        </div>
        <p class="small muted">Rundown hari ini akan diganti dengan salinan (sebagai draft), lalu bisa diedit.</p>
      </div>` : ''}`);
    rdRender();
  } catch (e) { errBox(v, e); }
}

function rdRender() {
  $('#rd-rows').innerHTML = C.rd.map((r, i) => `
    <div class="rd-item" data-i="${i}">
      <div class="rd-head">
        <span class="rd-no">${i + 1}</span>
        <input type="time" class="rd-f" data-k="jam_mulai" value="${esc(r.jam_mulai || '')}" aria-label="Jam mulai">
        <span>–</span>
        <input type="time" class="rd-f" data-k="jam_selesai" value="${esc(r.jam_selesai || '')}" aria-label="Jam selesai">
        <button class="btn sm danger" title="Hapus baris" onclick="rdHapus(${i})">✕</button>
      </div>
      <input class="rd-f mt" data-k="kegiatan" value="${esc(r.kegiatan || '')}" placeholder="Kegiatan, mis. Pembukaan / Materi K3 Listrik">
      <div class="grid2" style="gap:6px;margin-top:6px">
        <input class="rd-f" data-k="pemateri" value="${esc(r.pemateri || '')}" placeholder="Pemateri / trainer (opsional)">
        <input class="rd-f" data-k="instansi" value="${esc(r.instansi || '')}" placeholder="Instansi pemateri, mis. Disnakertrans Prov. DIY / Praktisi K3">
        <input class="rd-f" data-k="keterangan" value="${esc(r.keterangan || '')}" placeholder="Keterangan (opsional)">
      </div>
    </div>`).join('');
}

/** Membaca isian form ke C.rd sebelum baris ditambah/dihapus/disimpan. */
function rdBaca() {
  C.rd = $$('#rd-rows .rd-item').map(el => {
    const o = {};
    $$('.rd-f', el).forEach(f => { o[f.dataset.k] = f.value; });
    const lama = C.rd[Number(el.dataset.i)] || {};
    if (lama.id_rundown) o.id_rundown = lama.id_rundown;
    return o;
  });
}

function rdTambah() {
  rdBaca();
  const last = C.rd[C.rd.length - 1];
  C.rd.push({ jam_mulai: last && last.jam_selesai || '' });
  rdRender();
  const items = $$('#rd-rows .rd-item');
  $('input[data-k=kegiatan]', items[items.length - 1]).focus();
}

function rdHapus(i) { rdBaca(); C.rd.splice(i, 1); if (!C.rd.length) C.rd.push({}); rdRender(); }

function rdSimpan(btn, status) {
  rdBaca();
  busy(btn, async () => {
    await call('rundownSimpan', { id_hari: C.idHari, items: C.rd, status: status });
    toast(status === 'terbit' ? 'Rundown diterbitkan ke peserta.' : 'Draft rundown disimpan.', 'ok');
    tabRundown();
  });
}

function rdSalin(btn) {
  rdBaca();
  if (C.rd.some(r => r.kegiatan) && !confirm('Ganti rundown hari ini dengan salinan dari hari yang dipilih?')) return;
  busy(btn, async () => {
    await call('rundownSalin', { id_hari: C.idHari, id_hari_asal: $('#rd-asal').value });
    toast('Rundown disalin sebagai draft.', 'ok');
    tabRundown();
  });
}

function bacaFile(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('File tidak terbaca.'));
    fr.readAsDataURL(file);
  });
}

function uploadMateri(form) {
  const file = form.file.files[0];
  const link = form.link.value.trim();
  if (!file && !link) return toast('Pilih file atau isi link.', 'error');
  if (file && file.size > 20 * 1024 * 1024) return toast('File lebih dari 20 MB. Simpan sebagai PDF atau gunakan link Google Drive.', 'error');
  busy(form.querySelector('button.primary'), async () => {
    const data = { id_hari: C.idHari, kategori: form.kategori.value, tampil_mulai: form.tampil_mulai.value, judul: form.judul.value };
    if (file) data.file = { nama: file.name, data: await bacaFile(file) };
    else data.link = link;
    await call('materiTambah', data);
    toast('Materi diupload.', 'ok');
    tabMateri();
  }, 'Mengupload…');
}

function hapusMateri(btn, id, judul) {
  if (!confirm('Hapus materi "' + judul + '"?')) return;
  busy(btn, async () => { await call('materiHapus', { id_materi: id }); toast('Materi dihapus.', 'ok'); tabMateri(); });

async function uploadDok(btn) {
  const files = Array.from($('#dok-files').files || []);
  if (!files.length) return toast('Pilih foto terlebih dahulu.', 'error');
  const idRundown = $('#dok-rundown').value, ket = $('#dok-ket').value;
  const bar = $('#dok-progress span'), txt = $('#dok-progress-text');
  $('#dok-progress').classList.remove('hidden');
  let ok = 0;
  const gagal = [];
  await busy(btn, async () => {
    for (let i = 0; i < files.length; i++) {
      txt.textContent = 'Mengupload ' + (i + 1) + ' dari ' + files.length + '…';
      try {
        // Diperkecil agar hemat penyimpanan: versi tampilan 1280 px, versi laporan PDF 640 px.
        const foto = await kompresGambar(files[i], 1280, 0.7);
        const fotoKecil = await kompresGambar(files[i], 640, 0.62);
        await call('dokTambah', { id_hari: C.idHari, id_rundown: idRundown, keterangan: ket, foto: foto, foto_kecil: fotoKecil });
        ok++;
      } catch (e) { gagal.push(files[i].name + ': ' + e.message); }
      bar.style.width = Math.round((i + 1) / files.length * 100) + '%';
    }
  }, 'Mengupload…');
  if (gagal.length) toast(ok + ' foto berhasil, ' + gagal.length + ' gagal. ' + gagal[0], 'error');
  else toast(ok + ' foto diupload.', 'ok');
  tabDok();
}

/** Gambar diperkecil (sisi terpanjang maks `max` px) dengan tetap menjaga transparansi PNG. */
function kompresPng(file, max) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * scale);
      c.height = Math.round(img.naturalHeight * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror = () => reject(new Error('Bukan file gambar yang valid.'));
    img.src = URL.createObjectURL(file);
  });
}

/** Mengunduh file dari isi base64 (PDF dari server). */
function simpanFile(nama, base64, mime) {
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  const a = document.createElement('a');
  a.href = url; a.download = nama; a.target = '_blank';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function buatLaporan(btn) {

    : 'Menyusun laporan… ini bisa memakan waktu 1–5 menit, jangan tutup halaman.';
  busy(btn, async () => {
    try {
      const res = await call('laporanBuat', {
        id_batch: C.batch.id_batch, jenis: jenis, id_hari: C.idHari,
        dari: $('#lap-dari').value, sampai: $('#lap-sampai').value,
      });
      simpanFile(res.nama, res.data, 'application/pdf');
      toast('Laporan dibuat: ' + res.nama, 'ok');
      tabLaporan();
    } catch (e) {
      status.className = 'alert bad';
      status.textContent = e.message + (jenis !== 'harian'
        ? ' — Jika waktu habis, buat "Laporan absensi" per rentang nomor absen.' : '');
